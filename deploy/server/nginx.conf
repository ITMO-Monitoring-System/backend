map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    # Resolve Compose service names again after containers receive new IPs.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $backend_upstream backend:8080;
    set $tracking_upstream face_tracking:8000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    location = / { return 302 /fizon/; }
    location = /fizon { return 302 /fizon/; }
    location = /login { return 302 /fizon/login; }
    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Keep the current Vite base /fizon/, but files in the image live at /assets/.
    location /fizon/ {
        rewrite ^/fizon/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Service-to-service methods must not be exposed via the browser gateway.
    location = /api/service { return 404; }
    location ^~ /api/service/ { return 404; }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /tracking/ {
        rewrite ^/tracking/(.*)$ /$1 break;
        proxy_pass http://$tracking_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / { return 404; }
}
